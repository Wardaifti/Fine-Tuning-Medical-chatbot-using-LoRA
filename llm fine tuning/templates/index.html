<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #8ee9d3, #a0b8e6);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px #000000;
        }
        .chat-container {
            background: white;
            width: 500px;
            height: 400px;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .user-message, .bot-message {
            max-width: 70%;
            padding: 10px;
            margin: 5px;
            border-radius: 15px;
        }
        .user-message {
            align-self: flex-start;
            background-color: #dcedc8;
        }
        .bot-message {
            align-self: flex-end;
            background-color: #e0f7fa;
        }
        .input-container {
            display: flex;
            margin-top: 20px;
            width: 500px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }
        button {
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Medical Chatbot</h1>
    <div class="chat-container" id="chatbox"></div>

    <form id="chat-form" class="input-container">
        <input type="text" id="user-input" placeholder="Ask your medical question..." required>
        <button type="submit">Send</button>
    </form>

    <script>
        const form = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatbox = document.getElementById('chatbox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (message) {
                // Show user message
                chatbox.innerHTML += `<div class="user-message">You: ${message}</div>`;
                userInput.value = "";

                // Send to backend
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();
                const botResponse = data.response;

                // Show bot response
                chatbox.innerHTML += `<div class="bot-message">Bot: ${botResponse}</div>`;

                // Auto scroll to bottom
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        });
    </script>

</body>
</html>
